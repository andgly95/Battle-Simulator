[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/simulation",
    "crates/era_napoleonic",
    "crates/era_ww1",
    "crates/renderer",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Battle Simulator Contributors"]
repository = "https://github.com/yourusername/battle-simulator"

[workspace.dependencies]
# Core dependencies
glam = "0.27"           # SIMD-optimized math
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"

# Parallelism
rayon = "1.8"

# ECS options
bevy_ecs = "0.14"
# specs = "0.20"        # Alternative ECS

# Rendering (optional)
pixels = "0.15"         # 2D pixel buffer rendering (compatible with winit 0.30+)
wgpu = "0.19"
winit = "0.30"
egui = "0.27"
egui-wgpu = "0.27"

# Utilities
rand = "0.8"
rand_distr = "0.4"
fxhash = "0.2"
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Development
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
lto = "fat"

[profile.dev]
opt-level = 1  # Slight optimization for better dev performance

[profile.dev.package."*"]
opt-level = 2  # Optimize dependencies even in dev mode
