# French 12-Pounder Cannon (Canon de 12 Gribeauval)
# The backbone of French artillery in the Napoleonic Wars

[weapon]
id = "french_12_pounder_gribeauval"
name = "Canon de 12 Gribeauval"
era = "napoleonic"
type = "smoothbore_artillery"
nation = "france"
period_start = 1765
period_end = 1825

[weapon.description]
short = "French 12-pounder field gun"
long = """
The Canon de 12 Gribeauval was the standard heavy field piece of French artillery.
Designed by Jean-Baptiste Vaquette de Gribeauval, it featured standardized parts,
improved carriages, and better mobility than previous designs. Napoleon concentrated
these guns in grand batteries to devastating effect.
"""

[weapon.specifications]
caliber = 121.0          # mm
barrel_length = 2.286    # meters
total_weight = 1100      # kg (gun only)
total_weight_with_carriage = 1900  # kg

crew_size = 8
crew_minimum = 6

[weapon.performance]
# Rate of fire
rate_of_fire = 2.0       # rounds per minute (sustained)
rate_of_fire_max = 3.0   # rounds per minute (short duration)
reload_time = 30.0       # seconds (average)

# Range
effective_range = 800    # meters
maximum_range = 1800     # meters
point_blank_range = 400  # meters (flat trajectory)

# Mobility
limbered_speed = 2.5     # m/s (walking pace)
unlimbered_time = 120    # seconds to deploy
limbered_time = 90       # seconds to pack up

[weapon.accuracy]
base_accuracy = 0.60     # 60% at effective range

[weapon.accuracy.range_modifiers]
"200" = 1.5   # 90% accuracy
"400" = 1.3   # 78% accuracy (point blank)
"600" = 1.1   # 66% accuracy
"800" = 1.0   # 60% accuracy (effective range)
"1000" = 0.7  # 42% accuracy
"1200" = 0.5  # 30% accuracy
"1400" = 0.3  # 18% accuracy
"1600" = 0.2  # 12% accuracy

[weapon.ammunition]
# Ammunition load
rounds_per_gun = 100
standard_load_distribution = { round_shot = 70, canister = 20, shell = 10 }

# Ammunition types available
ammunition_types = ["round_shot", "canister", "shell"]

[weapon.ammunition.round_shot]
name = "Round shot"
weight = 5.5             # kg (12 pounds)
muzzle_velocity = 450    # m/s
damage = 100
penetration = 0.8        # High penetration
effective_vs = ["formations", "fortifications", "structures"]

# Ricochet effect
ricochet_enabled = true
ricochet_bounces = 3
ricochet_damage_falloff = 0.7  # 70% damage per bounce

description = """
Solid iron cannonball. Primary ammunition type. Effective against formations,
especially columns. Can ricochet off hard ground, bowling through multiple ranks.
Devastating psychological impact from visible projectiles.
"""

[weapon.ammunition.canister]
name = "Canister shot"
balls_per_round = 112
ball_diameter = 27       # mm
spread_angle = 15        # degrees
effective_range = 300    # meters
optimal_range = 100      # meters

damage_per_ball = 1
penetration = 0.1        # Low penetration

effective_vs = ["infantry", "cavalry", "close_assault"]

description = """
Tin can filled with iron balls. Turns cannon into giant shotgun. Devastating
at close range against massed infantry. The last-ditch anti-personnel round.
"""

[weapon.ammunition.shell]
name = "Explosive shell"
weight = 5.0             # kg
explosive_weight = 0.4   # kg of black powder
fuse_type = "time"
fuse_time_max = 5.0      # seconds

blast_radius = 10        # meters (effective casualty radius)
fragment_count = 50
effective_vs = ["formations", "structures", "morale"]

description = """
Hollow iron sphere filled with gunpowder and fitted with a timed fuse.
Explodes above or within enemy formations, showering them with fragments.
Requires skilled gunners to time the fuse correctly.
"""

[weapon.tactical]
# Tactical characteristics
role = "heavy_field_artillery"
deployment = "battery"  # Typically deployed in batteries of 6-8 guns
preferred_targets = ["infantry_columns", "artillery", "fortifications"]

# Formation effects
vs_line_modifier = 1.0
vs_column_modifier = 1.5    # Devastating against columns
vs_square_modifier = 1.2
vs_skirmish_modifier = 0.4  # Hard to hit dispersed troops

# Terrain effects
requires_stable_ground = true
mud_penalty = 0.5
soft_ground_penalty = 0.7
hill_elevation_bonus = 1.2

[weapon.crew]
# Crew positions
positions = [
    "chef de pièce",      # Gun captain
    "pointeur",           # Aimer
    "chargeur",           # Loader
    "boute-feu",          # Firer
    "pourvoyeur",         # Ammunition handler (2)
    "servants"            # General crew (2)
]

# Crew casualties affect performance
crew_effectiveness = [
    { crew = 8, effectiveness = 1.0, rate_of_fire = 2.0 },
    { crew = 6, effectiveness = 0.9, rate_of_fire = 1.5 },
    { crew = 4, effectiveness = 0.7, rate_of_fire = 1.0 },
    { crew = 2, effectiveness = 0.4, rate_of_fire = 0.5 },
]

[weapon.vulnerability]
# Artillery is vulnerable to counter-battery and assault
armor = 0
crew_protection = 0      # No protection for crew
vulnerability_to_infantry = 2.0
vulnerability_to_cavalry = 3.0  # Very vulnerable to cavalry

# Can be captured
capturable = true
capture_time = 30        # seconds to spike or capture

[weapon.horses]
# Horse teams for movement
horses_required = 8
horses_casualty_effect = true  # Horse casualties reduce mobility

[weapon.historical]
designer = "Jean-Baptiste Vaquette de Gribeauval"
introduction_year = 1765
retirement_year = 1825

famous_uses = [
    "Grand Battery at Wagram (1809) - 100+ guns",
    "Grand Battery at Borodino (1812) - 100+ guns",
    "Waterloo (1815) - La Haye Sainte bombardment"
]

production_total = 2500

description = """
The Gribeauval system revolutionized French artillery. Standardized parts,
interchangeable components, and improved carriages made French guns the best
in Europe. Napoleon's artillery doctrine of massing guns in grand batteries
to pound breakthrough points was enabled by this weapon system.
"""

[weapon.doctrine]
napoleon_quote = "It is with artillery that war is made."

typical_deployment = """
Deployed in batteries of 6-8 guns, often combined with lighter pieces.
Napoleon's doctrine called for concentrating artillery at decisive points.
Grand batteries of 100+ guns would pound enemy positions before infantry assault.
Counter-battery fire was a priority to suppress enemy guns.
"""

crew_drill = """
Well-drilled French artillery crews could achieve 3 rounds per minute for
short periods. Sustained fire of 2 rounds per minute was standard.
Crew worked in coordinated sequence: swab, load, ram, prime, aim, fire.
"""

[weapon.cost]
manufacture_cost = 5000
ammunition_cost_per_round = 10
horse_team_cost = 2000
crew_training_time_days = 180
